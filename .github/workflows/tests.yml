name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-windows.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-windows.txt
      - name: Compile Python sources
        run: >-
          python -m py_compile pico_record.py pico_receiver.py manus_collector.py
          tactile_collector.py record_control.py export_dataset.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
